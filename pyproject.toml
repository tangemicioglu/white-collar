[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "white-collar"
version = "0.1.0"
description = "A narrow, agent-friendly local Office CLI"
requires-python = ">=3.11"
readme = "README.md"

[project.scripts]
white-collar = "whitecollar.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.setuptools.packages.find]
include = ["whitecollar*"]
