[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "white-collar"
version = "0.1.0"
description = "A narrow, agent-friendly local Office CLI"
requires-python = ">=3.11"
readme = "README.md"

[project.optional-dependencies]
dev = ["pytest>=8"]
office = ["Pillow>=10", "pywin32>=306; platform_system == 'Windows'"]

[project.scripts]
white-collar = "whitecollar.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "real_word: exercises the installed Microsoft Word COM server",
  "real_powerpoint: exercises the installed Microsoft PowerPoint COM server",
]

[tool.setuptools.packages.find]
include = ["whitecollar*"]
