name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build and test tools
        run: python -m pip install --upgrade build twine "pytest>=8"

      - name: Verify tag matches project version
        shell: bash
        run: |
          project_version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          tag_version="${GITHUB_REF_NAME#v}"
          if [[ "$project_version" != "$tag_version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match pyproject.toml version $project_version" >&2
            exit 1
          fi

      - name: Run Office-free tests
        run: python -m pytest -q

      - name: Build wheel and source distribution
        run: python -m build

      - name: Validate distribution metadata
        run: python -m twine check dist/*

      - name: Upload release packages
        uses: actions/upload-artifact@v4
        with:
          name: release-dist
          path: dist/*
          if-no-files-found: error

  windows-smoke:
    needs: build
    runs-on: windows-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download release packages
        uses: actions/download-artifact@v4
        with:
          name: release-dist
          path: dist

      - name: Install and smoke-test the wheel
        shell: pwsh
        run: |
          $wheel = Get-ChildItem -LiteralPath dist -Filter "white_collar-*.whl" | Select-Object -First 1
          if ($null -eq $wheel) { throw "The release artifact did not contain a wheel." }
          python -m pip install $wheel.FullName
          $version = white-collar --version
          $expected = $env:GITHUB_REF_NAME.TrimStart("v")
          if ($version -notmatch [regex]::Escape($expected)) { throw "Unexpected installed version: $version" }
          $doctor = white-collar doctor | ConvertFrom-Json
          if ($doctor.ok -ne $true) { throw "Installed wheel doctor check failed." }

  publish:
    needs: [build, windows-smoke]
    runs-on: ubuntu-latest
    steps:
      - name: Download release packages
        uses: actions/download-artifact@v4
        with:
          name: release-dist
          path: dist

      - name: Create GitHub release and upload packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
